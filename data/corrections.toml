# Reviewed corrections of rows the extractor misread (ADR-007, L1 §16).
# Found by the edge audit (reports/E1/edge_audit.md) and drafted by Claude on 2026-11-15.
# Each entry must match exactly ONE extracted row (`match` = the extracted text, before); otherwise the build
# fails. `evidence` is the page's text from poppler `pdftotext -layout` (an independent reader); the row
# images are in reports/E1/rows/. A release build refuses while any reviewed_by is empty.

# --- insecticide p. 25: the crop cell "Cotton" has no drawn top border (CELL_ORPHAN) ----------------------
# The extractor took the borderless cell for a merge from the row above, so both rows said Brinjal.

[[correct]]
id = "C-01"
doc = "mup_insecticide_2026-09-30"
page = 25
product = "DIMPROPYRIDAZ 120 g/l SL"
match = { crop = "Brinjal", pest = "White fly", wait = "31" }
set = { crop = "Cotton" }
covers = ["CELL_ORPHAN"]
evidence = "p. 25 lines 1-3: 'White fly 108 – 120 900 – 1000 500' / 'Cotton ... 31' / 'Jassids, Aphids 84 700 500'"
reviewed_by = "Claude (delegated by Tarun, 2026-11-15)"

[[correct]]
id = "C-02"
doc = "mup_insecticide_2026-09-30"
page = 25
product = "DIMPROPYRIDAZ 120 g/l SL"
match = { crop = "Brinjal", pest = "Jassids, Aphids", wait = "31" }
set = { crop = "Cotton" }
evidence = "p. 25 lines 1-3: the same Cotton cell spans both rows (the waiting period 31 is printed once)"
reviewed_by = "Claude (delegated by Tarun, 2026-11-15)"

