[project]
name = "labelclaim"
version = "0.0.1"
description = "Answers 'is this pesticide approved for this crop and pest?' from India's official CIB&RC register, with citations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pdfplumber>=0.11,<0.12",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.28,<1",
  "rapidfuzz>=3.10,<4",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "hypothesis>=6.115,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.uv]
# NFR-7 / ADR-005: only releases at least 14 days older than the lock date (2026-11-13).
exclude-newer = "2026-10-30T00:00:00Z"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelclaim"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]  # code blocks in design docs are sketches, not source

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PL", "S"]
ignore = [
  "PLR2004",  # magic values are fine in table-driven tests and grammars
  "RUF001",   # the register uses en dashes and other Unicode punctuation; tests must reproduce them
  "RUF002",   # ... and docstrings quote it
]

[tool.ruff.lint.pylint]
# The build orchestrator and the row state machine branch once per case by design (one rule per row
# kind / per invariant); splitting them would scatter the rules the LLD lists in one place.
max-args = 8
max-positional-args = 8
max-branches = 16

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913"]
"tools/mutants.py" = ["E501", "S603", "S404"]  # a table of source snippets; runs our own pytest only

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not corpus and not perf' --strict-markers"
markers = [
  "corpus: needs the real register PDFs in the cache (opt-in: -m corpus)",
  "perf: latency measurements written to reports/perf (opt-in: -m perf)",
]

[tool.coverage.run]
branch = true
source = ["labelclaim"]
